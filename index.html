<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#ECEFE8">
<meta name="description" content="Acesso restrito à equipe do Café Fratelli.">
<title>Café Fratelli — Equipe</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://script.google.com">
<style>
  /* A página inteira é o aplicativo: sem margem, sem rolagem por fora.
     Quem rola é o app, por dentro — assim o cabeçalho dele fica sempre no lugar. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ECEFE8; }
  .carregando {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    font-family: Figtree, system-ui, "Segoe UI", Arial, sans-serif; color: #5E4E45; font-size: 14px;
  }
  .carregando strong { font-family: "Bodoni Moda", Georgia, serif; font-size: 30px; font-weight: 500; color: #1F4A38; }
  iframe {
    position: fixed; inset: 0; display: block; border: 0; background: transparent;
    width: 100%; height: 100%;
    height: 100dvh;                 /* altura real da tela no celular, descontando a barra do navegador */
  }
</style>
</head>
<body>

<div class="carregando" aria-hidden="true">
  <strong>Fratelli · equipe</strong>
  <span>Carregando…</span>
</div>

<iframe id="app" title="Café Fratelli — Equipe"
  allow="clipboard-read; clipboard-write; fullscreen"
  referrerpolicy="strict-origin-when-cross-origin"></iframe>

<noscript>
  <p style="position:fixed;bottom:16px;left:0;right:0;text-align:center;font-family:Arial;color:#9C2A2A">
    A plataforma precisa de JavaScript habilitado no navegador.
  </p>
</noscript>

<script>
(function () {
  /* ÚNICA LINHA A EDITAR, se a implantação mudar: o endereço do app que termina em /exec
     (Apps Script › Implantar › Gerenciar implantações). */
  var APP = "https://script.google.com/macros/s/AKfycbzCPiWM6nd6_HHrZq6dI8HHT2Db7Vq1r10d8Z5e5fUz8ckbEB9l41Rhr3JZhtJ4Ucof/exec";

  /* Só estes parâmetros passam para o app, e só em formato esperado. */
  function limpar(origem) {
    var ok = {};
    Object.keys(origem || {}).forEach(function (k) {
      var v = String(origem[k] == null ? "" : origem[k]);
      if (/^[a-z]{1,12}$/i.test(k) && /^[A-Za-z0-9_-]{1,40}$/.test(v)) ok[k] = v;
    });
    return ok;
  }
  function busca(par) {
    var q = Object.keys(par).map(function (k) {
      return encodeURIComponent(k) + "=" + encodeURIComponent(par[k]);
    }).join("&");
    return q ? "?" + q : "";
  }

  /* Abertura: o que estiver no endereço desta página vai para o app
     (ex.: app.seudominio.com/?p=area&cli=ABC123 abre direto a área). */
  /* Este endereço abre SEMPRE a entrada da equipe, ignorando o que vier na barra. */
  document.getElementById("app").src = APP + busca({ p: "equipe", embed: "1" });

})();
</script>
</body>
</html>
